<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    My Rights India — Favicon (small-size optimized)
    Simplified Ashoka Chakra with tricolor ring.
    No animation — cleaner at 16x16 / 32x32.
  -->
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="50" fill="#111111"/>

  <!-- Tricolor outer ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#tri)" stroke-width="3" opacity="0.5"/>

  <!-- Chakra outer ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#FF9933" stroke-width="4"/>

  <!-- 12 visible spokes (24 is too dense at small sizes, show every other) -->
  <line x1="50" y1="50" x2="50.0" y2="14.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68.0" y2="18.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="81.2" y2="32.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="86.0" y2="50.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="81.2" y2="68.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="68.0" y2="82.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50.0" y2="86.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="32.0" y2="82.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="18.8" y2="68.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="14.0" y2="50.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="18.8" y2="32.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="32.0" y2="18.0" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hub -->
  <circle cx="50" cy="50" r="6" fill="#FF9933"/>
  <circle cx="50" cy="50" r="2.5" fill="#111111"/>
</svg>
